  <main class="app">
    <header>
      <h1>Websim Interactive Clip Generator</h1>
      <p class="lede">Explore Websim AI features: Text-to-Speech, Image Gen, Chat, and Upload. Mobile friendly.</p>
    </header>

    <section id="stage" class="stage">
      <button id="speakBtn" class="speak">Tap to speak — Talk to Websim</button>

        <div id="overlay" class="overlay">
          <div id="status" class="status">Idle</div>
          <div id="chatOverlay" class="chatOverlay"></div>
        </div>
      </div>
    </section>

    <footer>
      <small>Built for demo. Uses global "websim" APIs (imageGen, textToSpeech, chat.completions, upload).</small>
    </footer>
  </main>
